<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Open Graph / Facebook meta tags for link preview -->
    <meta property="og:title" content="UAE Internet Outage Issue Resolved">
    <meta property="og:description" content="The recent internet outage in the UAE has been fully resolved. Click to read more details.">
    <meta property="og:type" content="article">
    <!-- Optional: Add an og:image if you want a custom thumbnail image; host an image somewhere and link it here -->
    <!-- <meta property="og:image" content="https://example.com/path-to-your-image.jpg"> -->
    
    <!-- Twitter Card meta tags for similar preview on X/Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="UAE Internet Outage Issue Resolved">
    <meta name="twitter:description" content="The recent internet outage in the UAE has been fully resolved. Click to read more details.">
    <!-- Optional: twitter:image same as above -->
    
    <!-- Actual page title (this might show in browser tab, but previews use og:title) -->
    <title>Haha Got You!</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .message {
            font-size: 48px;
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="message">
        Haha Got You!
    </div>
</body>
</html>
